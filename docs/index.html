<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a2733">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="לידים">
<title>מצפה כנרת · ניהול לידים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#17252e;--mut:#66767f;--line:#e2e8eb;--bg:#edf1f3;--card:#fff;--teal:#1b8794;--teal-d:#0f5b66;--teal-soft:#e3f3f5;--gold:#c59a3e;--gold-soft:#f8f0dc;--dark:#0a2733;--green:#16a34a;--red:#dc2626;--blue:#2563eb;
--sh:0 1px 2px rgba(16,40,50,.06),0 6px 22px rgba(16,40,50,.07);--sh2:0 2px 4px rgba(16,40,50,.08),0 14px 34px rgba(16,40,50,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Heebo","Segoe UI",system-ui,Arial,sans-serif;font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.14em}
.rail{display:none}
.brandbar{display:flex;align-items:center;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top)) 18px 10px;background:linear-gradient(135deg,#0e3f4c,#071d26)}
.brandbar img{height:50px;display:block}
.brandbar .sf{height:42px}
.shell{padding-bottom:calc(86px + env(safe-area-inset-bottom))}
.page{display:none;padding:0 12px 20px;max-width:1500px;margin:0 auto}
.page.on{display:block;animation:fade .22s}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.bnav{position:fixed;bottom:0;inset-inline:0;z-index:40;background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.bnav button{flex:1;height:64px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--mut);position:relative}
.bnav button svg{font-size:22px}
.bnav button.on{color:var(--teal-d)}
.bnav button.on::before{content:"";position:absolute;top:0;width:34px;height:3px;border-radius:0 0 4px 4px;background:var(--gold)}
.bdg{position:absolute;top:7px;margin-inline-start:22px;background:var(--red);color:#fff;border-radius:99px;min-width:18px;height:18px;font-size:11px;display:grid;place-items:center;padding:0 5px;font-weight:700}
/* ---- leads page ---- */
.leads-layout{display:block}
.fpanel{display:none}
.lcol{min-width:0}
.sticky{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 12px;margin:0 -12px}
.pagehead{display:none}
.srow1{display:flex;gap:8px}
.search{flex:1;position:relative}
.search input{width:100%;height:48px;border-radius:14px;border:1.5px solid var(--line);background:#fff;padding:0 44px 0 40px;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}
.search input:focus{border-color:var(--teal);box-shadow:0 0 0 4px rgba(27,135,148,.12)}
.search svg{position:absolute;right:15px;top:15px;font-size:18px;color:var(--mut);pointer-events:none}
.search .clr{position:absolute;left:6px;top:7px;width:34px;height:34px;border:0;background:#eef2f4;border-radius:50%;display:none;place-items:center;color:var(--mut)}
.search.has .clr{display:grid}
.iconbtn{width:48px;height:48px;border-radius:14px;border:1.5px solid var(--line);background:#fff;display:grid;place-items:center;font-size:20px;position:relative;color:var(--ink)}
.iconbtn .dot{position:absolute;top:-6px;inset-inline-start:-6px;background:var(--teal);color:#fff;border-radius:99px;font-size:12px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px;font-weight:700}
.rows{display:flex;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:2px 12px 0}
.rows::-webkit-scrollbar{display:none}
.chips{display:flex;gap:6px;padding:8px 0 2px;flex:none}
.chips+.chips{margin-inline-start:6px;padding-inline-start:10px;border-inline-start:1.5px solid var(--line)}
.chip{flex:none;height:36px;padding:0 13px;border-radius:99px;border:1.5px solid var(--line);background:#fff;display:flex;align-items:center;gap:7px;font-size:14px;font-weight:500;white-space:nowrap;transition:all .12s}
.chip b{font-weight:600;color:var(--mut);font-size:12.5px}
.chip .dt{width:10px;height:10px;border-radius:50%;background:var(--hc,#cfd8dc);border:1px solid rgba(0,0,0,.12)}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.chip.on b{color:#fff;opacity:.85}
.chip.hon.on{background:var(--hc);border-color:var(--hc)}
.chip.hon.on.lt{background:#fff;color:var(--ink);border-color:var(--ink)}
.chip.zero{opacity:.4}
.tools{display:flex;align-items:center;gap:6px;padding:10px 0 2px;font-size:14px;color:var(--mut)}
.tools .grow{flex:1}
#resCount{white-space:nowrap}
.tools select{height:36px;border-radius:10px;border:1.5px solid var(--line);background:#fff;padding:0 6px;font-size:13px;max-width:128px}
.gbtn{height:36px;min-width:36px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--mut);display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 9px;font-size:13px;font-weight:700}
.gbtn svg{font-size:16px}
.gbtn:disabled{opacity:.35;cursor:default}
.gbtn:not(:disabled):hover{color:var(--teal-d);border-color:var(--teal)}
.pills{display:flex;gap:6px;padding:6px 0 0;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;background:var(--teal-soft);color:var(--teal-d);border:0;border-radius:99px;padding:5px 11px;font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center;white-space:nowrap}
.pill.q{background:#fff3e0;color:#8a5a00}
.pill.clr{background:#fff;border:1.5px solid var(--red);color:var(--red);font-weight:700}
.pill .dt{width:9px;height:9px;border-radius:50%;background:var(--hc);border:1px solid rgba(0,0,0,.15)}
.grid{display:grid;gap:10px;grid-template-columns:1fr;padding-top:8px}
/* ---- compact card ---- */
.card{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"main main" "text text" "info ic";gap:5px 10px;background:linear-gradient(to left,color-mix(in srgb,var(--hc) 9%,#fff),#fff 38%);border-radius:16px;box-shadow:var(--sh);padding:11px 14px 10px 14px;padding-inline-start:19px;cursor:pointer;overflow:hidden;transition:box-shadow .15s}
.card::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:6px;background:var(--hc)}
@media(hover:hover){.card:hover{box-shadow:var(--sh2)}}
.c-main{grid-area:main;min-width:0}.c-text{grid-area:text;min-width:0}.c-text:empty{display:none}
.c-info{grid-area:info;display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-width:0;align-self:center}
.c-ic{grid-area:ic;display:flex;gap:7px;align-self:center}
.c-top{display:flex;gap:10px;align-items:center;justify-content:space-between}
.c-name{font-weight:800;font-size:17px;line-height:1.25;overflow-wrap:anywhere;flex:1}
.c-name small{font-weight:500;color:var(--mut);font-size:13px}
.stg{flex:none;font-size:12px;padding:2px 10px;border-radius:99px;background:var(--teal-soft);color:var(--teal-d);font-weight:700;white-space:nowrap}
.stg.s-חתם{background:var(--gold-soft);color:#8a6410}
.stg.s-נפגשנו,.stg.s-פגישה{background:#e8f6ee;color:#17743f}
.stg.s-חדש{background:#eaf0ff;color:#2d4bb0}
.stg.s-לא-עונה{background:#f1f3f4;color:#59666e}
.c-badges{display:flex;flex-wrap:wrap;gap:5px 6px;margin-top:5px;align-items:center}
.sp{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:8px;padding:2px 8px}
.sp.in{background:var(--teal-soft);color:var(--teal-d)}
.sp.out{background:var(--gold-soft);color:#8a6410}
.hp{display:inline-flex;align-items:center;font-size:12px;font-weight:700;border-radius:8px;padding:2px 9px;background:var(--hc);color:#fff}
.hp.lt{background:#fff;color:var(--ink);border:1.5px solid var(--hc);padding:.5px 8px}
.cm{font-size:12.5px;color:var(--mut);display:inline-flex;align-items:center;gap:3px}
.c-st{font-size:14.5px;overflow-wrap:anywhere;white-space:pre-line}
.c-ab{margin-top:2px;font-size:13px;color:var(--mut);overflow-wrap:anywhere}
.c-ab svg{margin-inline-end:4px}
.lb{font-size:11.5px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:0 8px;color:var(--mut)}
.tk{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:8px;padding:2px 8px;background:#fff3e0;color:#9a5b00;max-width:100%}
.tk.late{background:#fee2e2;color:#b91c1c}
.ib2{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);background:#fff;color:var(--teal);font-size:18px;text-decoration:none;transition:all .12s}
.ib2.wa{color:#1fa855;border-color:#bfe8cd;background:#f2fbf5}
.ib2.ml{color:#a47a22;border-color:#ecd9ab;background:#fffaf0}
.ib2:active{transform:scale(.92)}
@media(hover:hover){.ib2:hover{box-shadow:0 3px 10px rgba(0,0,0,.15)}}
.empty{text-align:center;color:var(--mut);padding:50px 10px;grid-column:1/-1}
.empty svg{font-size:42px;color:#b8c4ca}
/* ---- filter panel ---- */
.fp-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.fp-head h3{margin:0;font-size:17px}
.fg{border-top:1px solid var(--line);padding:2px 16px}
.fg summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;height:46px;font-weight:700;font-size:14.5px}
.fg summary::-webkit-details-marker{display:none}
.fg summary .sel{background:var(--teal);color:#fff;border-radius:99px;font-size:12px;padding:0 8px;margin-inline-start:8px}
.fg summary svg{transition:transform .2s;color:var(--mut)}
.fg[open] summary svg{transform:rotate(180deg)}
.fg .wrap{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 14px}
.fg .chip{height:34px;font-size:13.5px}
.fp-collapse{display:none}
.fpstrip{display:none}
.rm-all{height:34px;border:1.5px solid var(--red);background:#fff;color:var(--red);border-radius:10px;padding:0 11px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:5px}
/* ---- sheets ---- */
.back{position:fixed;inset:0;background:rgba(10,30,36,.5);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.back.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:60;bottom:0;left:50%;transform:translate(-50%,104%);width:min(720px,100%);max-height:94dvh;background:var(--bg);border-radius:22px 22px 0 0;display:flex;flex-direction:column;transition:transform .26s cubic-bezier(.2,.8,.2,1);box-shadow:var(--sh2);touch-action:pan-y}
.sheet.on{transform:translate(-50%,0)}
.sheet.tall{height:95dvh}
.sh-head{display:flex;align-items:center;gap:8px;padding:12px 14px;background:#fff;border-radius:22px 22px 0 0;border-bottom:1px solid var(--line);position:relative}
.sh-head::before{content:"";position:absolute;top:5px;left:50%;margin-left:-20px;width:40px;height:4px;border-radius:4px;background:#d5dde1}
.sh-head h3{margin:0;font-size:19px;flex:1}
.sh-head input.nm{flex:1;font-size:21px;font-weight:800;border:0;background:transparent;min-width:0;padding:8px 0 4px;outline:none}
.sh-body{overflow-y:auto;padding:14px 16px 24px;flex:1;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sh-foot{padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);display:flex;gap:8px}
.btn{height:48px;border-radius:14px;border:1.5px solid var(--line);background:#fff;padding:0 18px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:all .12s}
.btn.pri{background:linear-gradient(135deg,var(--teal),var(--teal-d));color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(27,135,148,.35)}
.btn.danger{color:var(--red);border-color:#f3b4b4}
.btn.sm{height:38px;padding:0 13px;font-size:14px;border-radius:11px}
.btn:active{transform:scale(.98)}
.linkbtn{background:none;border:0;color:var(--teal-d);font-weight:700;padding:6px;font-size:14px}
.grp{margin-bottom:18px}
.grp>label,.lbl{display:block;font-weight:700;font-size:13px;color:var(--mut);margin:0 2px 7px}
.box{background:#fff;border-radius:16px;padding:14px;box-shadow:var(--sh)}
.crw{display:flex;gap:8px;margin-bottom:8px}
.crow{flex:1;display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;text-decoration:none;color:var(--ink);min-height:56px;min-width:0}
.crow .ci{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:var(--teal-soft);color:var(--teal-d);flex:none}
.crow.wa .ci{background:#e4f7ea;color:#1fa855}.crow.ml .ci{background:var(--gold-soft);color:#9a7220}
.crow .t{flex:1;min-width:0}.crow .t small{display:block;color:var(--mut);font-size:12px;font-weight:600}
.crow .t b{direction:ltr;unicode-bidi:plaintext;display:block;text-align:right;overflow:hidden;text-overflow:ellipsis;font-size:16.5px}
.crow .go{color:var(--mut);font-size:13px;font-weight:700}
.cp{flex:none;width:56px;min-height:56px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--mut);display:grid;place-items:center;font-size:18px;padding:0;transition:all .12s}
.cp:hover{color:var(--teal-d);border-color:var(--teal)}
.cp:active,.cp.ok{background:var(--teal);color:#fff;border-color:var(--teal)}
.hs{display:flex;flex-wrap:wrap;gap:7px}
.hs button{min-height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.hs button .dt{width:12px;height:12px;border-radius:50%;background:var(--hc);border:1px solid rgba(0,0,0,.15)}
.hs button.on{background:var(--hc);border-color:var(--hc);color:#fff}
.hs button.on.lt{background:#fff;color:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.hs button.on .dt{background:#fff}
.seg{display:flex;flex-wrap:wrap;gap:7px}
.seg button{flex:1 1 auto;min-width:76px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:14px;padding:0 10px}
.seg button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.seg.big button{height:64px;font-size:16px;font-weight:800;flex-direction:column;display:flex;align-items:center;justify-content:center;gap:2px}
.seg.big button small{font-weight:500;font-size:12px;opacity:.85}
.seg.big button.out.on,.seg button.out.on{background:var(--gold);border-color:var(--gold)}
.field{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field .full{grid-column:1/-1}
.field label{display:block;font-size:12.5px;color:var(--mut);font-weight:700;margin-bottom:4px}
.field input,.field select,.field textarea,.nb input,.nb textarea,.ta{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-size:16px;min-height:46px;outline:none}
.field input:focus,.field textarea:focus,.nb input:focus,.nb textarea:focus,.ta:focus{border-color:var(--teal);box-shadow:0 0 0 4px rgba(27,135,148,.1)}
.field textarea,.ta{min-height:76px;resize:vertical}
.field input[dir=ltr]{text-align:right}
.field .inl{display:flex;gap:6px}
.quick{display:flex;flex-wrap:wrap;gap:7px}
.quick button{height:44px;padding:0 13px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.quick button:active{background:var(--teal-soft)}
.quick button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.quick.tk2 button{border-color:#f0d9a8;background:#fffaf0;color:#7a5410}
.nb{display:flex;gap:8px;margin-top:8px}
.nb textarea{min-height:46px;height:46px;resize:none}
.tl{margin:0;padding:0;list-style:none}
.tl li{background:#fff;border-radius:12px;padding:9px 12px;margin-bottom:7px;font-size:14.5px;border-inline-start:4px solid var(--teal);position:relative;overflow-wrap:anywhere}
.tl .d{font-size:12px;color:var(--mut);font-weight:700;display:block}
.tl .x{position:absolute;left:6px;top:6px;border:0;background:none;color:var(--mut);padding:4px}
.dgrid{display:block}
.trow{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:8px 12px;margin-bottom:7px;box-shadow:var(--sh);min-height:56px}
.trow.done .tt{text-decoration:line-through;color:var(--mut)}
.ck{width:30px;height:30px;border-radius:50%;border:2.5px solid #c3cfd5;background:#fff;flex:none;display:grid;place-items:center;color:#fff;font-size:16px;padding:0}
.ck:hover{border-color:var(--teal)}
.trow.done .ck{background:var(--green);border-color:var(--green)}
.trow .tm{flex:1;min-width:0}
.trow .tt{font-weight:600;overflow-wrap:anywhere}
.trow .tl2{font-size:12.5px;color:var(--teal-d);font-weight:700;background:none;border:0;padding:0}
.dp{position:relative;flex:none;display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;border-radius:8px;padding:5px 10px;background:var(--teal-soft);color:var(--teal-d);overflow:hidden}
.dp.late{background:#fee2e2;color:#b91c1c}.dp.today{background:#fff3e0;color:#9a5b00}.dp.none{background:#f1f3f4;color:var(--mut)}
.dp input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.trow .x{border:0;background:none;color:#9aa8af;padding:6px;font-size:16px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);width:max-content;background:#17252e;color:#fff;padding:11px 16px;border-radius:14px;z-index:120;display:flex;gap:16px;align-items:center;font-size:14.5px;box-shadow:var(--sh2);max-width:92vw;animation:rise .2s}
.toast button{background:none;border:0;color:#7dd3fc;font-weight:800;font-size:14.5px}
.fab{position:fixed;bottom:calc(78px + env(safe-area-inset-bottom));inset-inline-start:16px;width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#d6ae52,#b8892f);color:#fff;border:0;font-size:28px;box-shadow:0 8px 22px rgba(184,137,47,.5);z-index:35;display:grid;place-items:center}
.dlg{position:fixed;inset:0;z-index:130;background:rgba(10,30,36,.55);display:grid;place-items:center;padding:20px}
.dbox{background:#fff;border-radius:20px;padding:22px;width:min(380px,100%);box-shadow:var(--sh2)}
.dbox p{margin:0 0 16px;font-size:17px;font-weight:700}
.dbox .btn{width:100%;margin-top:8px}
/* ---- tasks / stats / settings ---- */
.ptitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 4px}
.ptitle h1{margin:0;font-size:26px;font-weight:800}.ptitle h1 small{font-size:14px;color:var(--mut);font-weight:500}
.ptitle .ub{display:flex;gap:6px}
.addtask{background:#fff;border-radius:16px;padding:12px;box-shadow:var(--sh);margin:10px 0 6px}
.addtask .r1{display:flex;gap:8px}
.addtask input[type=text]{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;height:48px;font-size:16px;min-width:0;outline:none}
.addtask input[type=text]:focus{border-color:var(--teal)}
.addtask .quick{margin-top:8px}
h2.sec{font-size:16px;margin:20px 4px 9px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h2.sec small{color:var(--mut);font-weight:500;font-size:13px}
.tabs{display:inline-flex;background:#fff;border-radius:12px;padding:4px;border:1.5px solid var(--line);margin:8px 0}
.tabs button{border:0;background:none;padding:8px 16px;border-radius:9px;font-weight:700;color:var(--mut)}
.tabs button.on{background:var(--teal);color:#fff}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#fff;border-radius:16px;padding:14px;box-shadow:var(--sh);text-align:start;border:0;position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:5px;background:var(--tc,var(--teal))}
.tile .n{font-size:32px;font-weight:800;line-height:1.1}.tile .t{color:var(--mut);font-size:13.5px;font-weight:600}
.bars{background:#fff;border-radius:16px;padding:6px 14px;box-shadow:var(--sh)}
.bar-row{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 0;text-align:start}
.bar-row .l{width:120px;flex:none;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .tr{flex:1;height:12px;background:var(--bg);border-radius:99px;overflow:hidden}
.bar-row .tr i{display:block;height:100%;background:var(--bc,var(--teal));border-radius:99px;min-width:4px}
.bar-row .v{width:34px;text-align:end;font-weight:800;font-size:14px}
.cols2{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}.cols2>*{min-width:0}
.srow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);min-width:0}
.srow:last-of-type{border-bottom:0}
.srow input[type=text]{flex:1;border:1.5px solid transparent;background:var(--bg);border-radius:10px;height:42px;padding:0 10px;font-size:15px;min-width:0;outline:none}
.srow input[type=text]:focus{border-color:var(--teal);background:#fff}
.srow input[type=color]{width:42px;height:42px;border:1.5px solid var(--line);border-radius:10px;padding:2px;background:#fff;flex:none}
.srow .ib{width:32px;height:32px;border-radius:10px;border:0;background:var(--bg);color:var(--mut);display:grid;place-items:center;flex:none}
.srow .cnt{font-size:12px;color:var(--mut);min-width:28px;text-align:center}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input[type=text]{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;height:46px;font-size:16px;outline:none}
.addrow input[type=color]{width:46px;height:46px;border:1.5px solid var(--line);border-radius:12px;padding:2px;background:#fff}
.sbox{background:#fff;border-radius:18px;padding:14px 16px;box-shadow:var(--sh)}
.sbox h3{margin:0 0 2px;font-size:17px}.sbox p{margin:0 0 8px;color:var(--mut);font-size:13.5px}
.hist{max-height:360px;overflow-y:auto}
.hrow{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:baseline}
.hrow time{color:var(--mut);font-size:12px;flex:none;width:92px}
.hrow.undone{opacity:.45;text-decoration:line-through}
.hrow.cur{font-weight:700}
.brandfoot{display:flex;align-items:center;justify-content:center;gap:28px;margin:26px 0 8px;background:linear-gradient(135deg,#0e3f4c,#071d26);border-radius:20px;padding:16px}
.brandfoot img{height:54px}

 body{font-size:15.5px}

 .fp-collapse{display:inline-flex}
 .leads-layout{transition:grid-template-columns .2s}

 .fpstrip{display:flex;flex-direction:column;align-items:center;gap:10px;width:58px;padding:14px 0;background:#fff;border:0;border-radius:18px;box-shadow:var(--sh);color:var(--teal-d);position:relative;font-weight:700}

 .pagehead{display:flex;align-items:center;justify-content:space-between;padding-top:14px}
 .pagehead h1{margin:0;font-size:28px;font-weight:800}.pagehead h1 small{font-size:14px;color:var(--mut);font-weight:500;margin-inline-start:8px}

 .grid{grid-template-columns:1fr;gap:9px}

 .toast{bottom:28px}

/* swipe down to close (touch devices) */
function enableSwipe(sheet){
 const body=sheet.querySelector('.sh-body');let x0=0,y0=0,dy=0,st=0,t0=0;
 sheet.addEventListener('touchstart',e=>{if(innerWidth>=1000){st=0;return}const inHead=!!e.target.closest('.sh-head');if(!inHead&&body.scrollTop>0){st=0;return}x0=e.touches[0].clientX;y0=e.touches[0].clientY;dy=0;st=1;t0=Date.now()},{passive:true});
 sheet.addEventListener('touchmove',e=>{if(!st)return;dy=e.touches[0].clientY-y0;if(st===1){const dx=Math.abs(e.touches[0].clientX-x0);if(dy>26&&dy>dx*2){st=2;sheet.style.transition='none'}else if(dy<-8||dx>14){st=0;return}}if(st===2){e.preventDefault();sheet.style.transform='translate(-50%,'+Math.max(0,dy)+'px)'}},{passive:false});
 sheet.addEventListener('touchend',()=>{if(st!==2){st=0;return}st=0;const fast=dy>60&&Date.now()-t0<260;sheet.style.transition='';
  if(dy>110||fast){if(isDirty()){sheet.style.transform='';askClose()}else{sheet.style.transform='translate(-50%,104%)';requestClose();setTimeout(()=>{sheet.style.transform=''},350)}}else sheet.style.transform=''},{passive:true})}
['shFilter','shLead','shNew','shConf'].forEach(id=>enableSwipe($('#'+id)));
/* ---------- filter handlers ---------- */
function toggle(k,v){if(v==='*'){F[k].clear();return}const s=F[k];s.has(v)?s.delete(v):s.add(v)}
function clearAll(){Object.keys(F).forEach(k=>{if(F[k] instanceof Set)F[k].clear()});F.q='';$('#q').value='';render()}
document.addEventListener('toggle',e=>{const d=e.target;if(d.classList&&d.classList.contains('fg')){const g=d.dataset.g;d.open?OPEN.add(g):OPEN.delete(g)}},true);
function copyText(v,btn,type){
 if(type==='tel')v=String(v).replace(/\D/g,'');
 const done=()=>{toast('הועתק: '+v);if(btn){btn.classList.add('ok');setTimeout(()=>btn.classList.remove('ok'),900)}};
 const fb=()=>{const ta=document.createElement('textarea');ta.value=v;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(x){toast('ההעתקה נכשלה')}ta.remove()};
 if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(v).then(done,fb);else fb()}
document.addEventListener('click',e=>{
 const cpb=e.target.closest('[data-copy]');if(cpb){e.stopPropagation();copyText(cpb.dataset.copy,cpb,cpb.dataset.ctype);return}
 if(e.target.closest('[data-fptoggle]')){fpCollapsed=!fpCollapsed;try{localStorage.setItem('crm-fp-collapsed',fpCollapsed?'1':'0')}catch(x){}renderPanels();return}
 const un=e.target.closest('[data-undo]');if(un){undo();return}
 const rd=e.target.closest('[data-redo]');if(rd){redo();return}
 const nv=e.target.closest('[data-nav]');if(nv){nav(nv.dataset.nav,true);return}
 const ch=e.target.closest('.chip[data-k]');if(ch){toggle(ch.dataset.k,ch.dataset.v);render();return}
 const pl=e.target.closest('.pill[data-rm]');if(pl){F[pl.dataset.rm].delete(pl.dataset.v);render();return}
 if(e.target.closest('[data-rmq]')){F.q='';$('#q').value='';render();return}
 if(e.target.closest('[data-clearall]')){clearAll();return}
 const go_=e.target.closest('[data-go]');if(go_){go(go_.dataset.go);return}
 const ct=e.target.closest('#list .card');if(ct){if(e.target.closest('a'))return;openLead(ct.dataset.id)}
});

const crow=(cls,href,icon,label,val,go,type,extra)=>`<div class="crw"><a class="crow ${cls}" href="${href}"${extra||''}><span class="ci">${ic(icon)}</span><span class="t"><small>${label}</small><b>${esc(val)}</b></span><span class="go">${go}</span></a>${cpBtn(val,type)}</div>`;

 </div>

 $('#dBody').innerHTML=`${top}<div class="dgrid">${act}${per}</div><div style="margin-top:10px;padding-top:16px;border-top:1px dashed var(--line)"><button class="btn danger" id="dDelete" style="width:100%">${ic('trash',16)} מחק את הליד</button></div><datalist id="dlCity">${allCities().map(c=>`<option value="${esc(c)}">`).join('')}</datalist>`}
function rerender(){const st=$('#dBody').scrollTop;renderLead();$('#dBody').scrollTop=st}
function logEntry(l,text,stage){(l.history=l.history||[]).push({t:new Date().toISOString(),text});l.lastContact=new Date().toISOString();
 if(stage&&S().stages.includes(stage)){const c=stageRank(l.stage),n=stageRank(stage);if(n>c||(stage==='לא עונה'&&stageRank(l.stage)<=1))l.stage=stage}}
function addTask(leadId,title,date){act('הוספת משימה',()=>{DB.tasks.push({id:uid('T'),leadId:leadId||'',title:(title||'').trim()||'לחזור אליו',date:date||'',done:false,created:new Date().toISOString()})})}
function toggleDone(id){const t=DB.tasks.find(x=>x.id===id);if(!t)return;act(t.done?'משימה נפתחה מחדש':'המשימה בוצעה ✓',()=>{t.done=!t.done;t.doneAt=t.done?new Date().toISOString():''});renderBadge()}

D.addEventListener('change',e=>{if(e.target.dataset.tdate){const t=DB.tasks.find(x=>x.id===e.target.dataset.tdate);act('שינוי תאריך משימה',()=>{t.date=e.target.value});afterTaskChange()}});
D.addEventListener('click',e=>{const l=draft;if(!l)return;const t=e.target;
 if(t.closest('[data-histall]')){histAll=!histAll;rerender();return}
 const hb=t.closest('[data-heat]');if(hb){l.heat=hb.dataset.heat;if(l.heat==='חתם'&&S().stages.includes('חתם'))l.stage='חתם';rerender();return}
 const sb=t.closest('[data-stage]');if(sb){l.stage=sb.dataset.stage;rerender();return}
 const ss=t.closest('[data-src2]');if(ss){l.source=ss.dataset.src2;if(l.source!=='פנו אלינו')l.via='';rerender();return}
 const sv=t.closest('[data-via]');if(sv){l.via=l.via===sv.dataset.via?'':sv.dataset.via;rerender();return}
 const lg=t.closest('[data-log]');if(lg){const x=LOGS[+lg.dataset.log];logEntry(l,x.t,x.stage);rerender();toast('נרשם ביומן: '+x.t+' (לחצו שמור)');return}
 if(t.closest('#noteAdd')){const v=$('#noteTxt').value.trim();if(!v)return;logEntry(l,v,null);rerender();return}

 const tx=t.closest('[data-tdel]');if(tx){act('מחיקת משימה',()=>{DB.tasks=DB.tasks.filter(x=>x.id!==tx.dataset.tdel)});afterTaskChange();return}
 const lb=t.closest('[data-lb]');if(lb){const s=lb.dataset.lb;l.labels=l.labels||[];const i=l.labels.indexOf(s);i>=0?l.labels.splice(i,1):l.labels.push(s);lb.classList.toggle('on');return}

function renderConflicts(){
 const intro=ST.conflicts.length?`<p style="margin:0 0 12px;color:var(--mut);font-size:14px">אותם פרטים שונו גם כאן וגם במכשיר אחר. בחרו מה להשאיר. שינויים בשדות שונים כבר מוזגו אוטומטית.</p>`:'';
 const body=ST.conflicts.map((c,i)=>{const who=esc(c.remote.updated_by||'מכשיר אחר')+' · '+(c.remote.updated_at?fmtDT(c.remote.updated_at):'');let inner='';
  if(c.type==='fields'){inner=c.fields.map(f=>`<div class="cfr"><b>${esc(FL[f.k]||f.k)}</b><div class="cfo"><button class="opt ${c.choice[f.k]==='mine'?'on':''}" data-ci="${i}" data-f="${esc(f.k)}" data-pick="mine"><small>שלי (במכשיר הזה)</small>${esc(fmtVal(f.mine))}</button><button class="opt srv ${c.choice[f.k]==='srv'?'on':''}" data-ci="${i}" data-f="${esc(f.k)}" data-pick="srv"><small>בשרת · ${who}</small>${esc(fmtVal(f.srv))}</button></div></div>`).join('')}
  else{const dl=c.type==='del-local';inner=`<div class="cfr"><div class="cfo"><button class="opt ${c.choice._==='mine'?'on':''}" data-ci="${i}" data-f="_" data-pick="mine"><small>שלי (במכשיר הזה)</small>${dl?'מחקתי – למחוק גם בשרת':'עדכנתי – להשאיר את הגרסה שלי'}</button><button class="opt srv ${c.choice._==='srv'?'on':''}" data-ci="${i}" data-f="_" data-pick="srv"><small>בשרת · ${who}</small>${dl?'עודכן – להשאיר את גרסת השרת':'נמחק – למחוק גם כאן'}</button></div></div>`}
  return`<div class="cf"><h4>${esc(confTitle(c))}</h4><div class="sub">${c.type==='fields'?'שינוי באותו שדה בשני מקומות':c.type==='del-local'?'נמחק כאן, אבל עודכן במכשיר אחר':'עודכן כאן, אבל נמחק במכשיר אחר'}</div>${inner}</div>`}).join('')||'<div class="empty">אין התנגשויות 🎉</div>';
 $('#cBody').innerHTML=intro+body;$('#cOk').disabled=!allChosen();$('#cMine').disabled=$('#cSrv').disabled=!ST.conflicts.length}
function openConflicts(){if(!ST.conflicts.length)return;renderConflicts();openSheet('shConf','conf')}
function maybeConflicts(){if(ST.conflicts.length&&!cur&&$('#dlg').hidden&&$('#login').hidden)openConflicts()}
function applyConflict(c,all){
 const pick=f=>all||c.choice[f];
 if(c.type==='fields'){const out={...c.merged};c.fields.forEach(f=>{const v=pick(f.k)==='srv'?f.srv:f.mine;if(v===undefined)delete out[f.k];else out[f.k]=v});putLocal(c.kind,c.id,out)}
 else if(c.type==='del-local'){if(pick('_')==='srv')putLocal(c.kind,c.id,c.remote.data)}
 else{if(pick('_')==='srv'){delLocal(c.kind,c.id);delete SYNC.base[c.key]}}}
function resolveConflicts(all){
 ST.conflicts.forEach(c=>applyConflict(c,all));ST.conflicts=[];persist();persistSync();
 if(cur&&cur.id==='shConf')closeSheet();render();toast('ההתנגשויות נפתרו');scheduleSync()}
$('#cBody').addEventListener('click',e=>{const o=e.target.closest('[data-pick]');if(!o)return;const c=ST.conflicts[+o.dataset.ci];c.choice[o.dataset.f]=o.dataset.pick;renderConflicts()});
$('#cMine').onclick=()=>resolveConflicts('mine');$('#cSrv').onclick=()=>resolveConflicts('srv');$('#cOk').onclick=()=>resolveConflicts(null);
$('#syncBadge').onclick=()=>{if(ST.conflicts.length)openConflicts();else{ST.offline=false;syncNow()}};
/* ---- login ---- */
const emailOf=u=>String(u||'').replace(/\D/g,'')+'@example.com';
function showLogin(msg){$('#login').hidden=false;$('#login').classList.remove('checking');document.body.classList.add('locked');$('#lerr').textContent=msg||'';$('#lgo').disabled=false;setTimeout(()=>$('#lu').focus(),100)}
function enterApp(off){$('#login').hidden=true;document.body.classList.remove('locked');REMOTE=makeRemote();ST.offline=!!off;startRealtime();startTimers();syncNow()}
$('#lshow').onclick=()=>{const i=$('#lp');const show=i.type==='password';i.type=show?'text':'password';$('#lshow').textContent=show?'הסתר':'הצג'};
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();if(!sb){$('#lerr').textContent='אין חיבור – נסו שוב';return}
 $('#lerr').textContent='';$('#lgo').disabled=true;$('#lgo').textContent='נכנס…';
 try{const{error}=await sb.auth.signInWithPassword({email:emailOf($('#lu').value),password:$('#lp').value});
  if(error){$('#lerr').textContent=/invalid/i.test(error.message)?'שם משתמש או סיסמה שגויים':(isNet(error)||/fetch/i.test(error.message)?'אין חיבור לאינטרנט':'שגיאה: '+error.message);$('#lgo').disabled=false;$('#lgo').textContent='כניסה';return}
  try{localStorage.setItem(AKEY,'1');localStorage.setItem(UKEY,$('#lu').value.replace(/\D/g,''))}catch(x){}
  $('#lp').value='';$('#lgo').textContent='כניסה';enterApp(false)}
 catch(x){$('#lerr').textContent='אין חיבור לאינטרנט';$('#lgo').disabled=false;$('#lgo').textContent='כניסה'}});
async function boot(){
 loadSync();refreshStatus();$('#icClose4').innerHTML=ic('x',18);
 if(typeof supabase==='undefined'||!supabase.createClient){if(localStorage.getItem(AKEY))enterApp(true);else showLogin('אין חיבור לאינטרנט');return}
 sb=supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
 sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&REMOTE){REMOTE=null;showLogin()}});
 let session=null,netErr=false;
 try{const r=await sb.auth.getSession();session=r.data&&r.data.session;if(r.error&&(isNet(r.error)||/fetch/i.test(r.error.message||'')))netErr=true}catch(e){netErr=true}
 if(session){try{localStorage.setItem(AKEY,'1')}catch(e){}enterApp(false)}
 else if(localStorage.getItem(AKEY)&&(netErr||!navigator.onLine))enterApp(true);
 else showLogin()}
function doLogout(){
 const warn=(ST.pending||ST.conflicts.length)?'יש '+ST.pending+' שינויים שעדיין לא סונכרנו – הם יאבדו. ':'';
 showDlg(warn+'להתנתק? הנתונים יימחקו מהמכשיר הזה (הם נשארים בשרת).',[['התנתק','danger',async()=>{try{await sb.auth.signOut()}catch(e){}[KEY,SKEY,AKEY,UKEY].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});location.reload()}],['ביטול','',()=>{}]])}
function accountBox(){
 const stx={ok:'מסונכרן',pending:'יש שינויים שממתינים לשליחה',offline:'לא מקוון',conflict:'יש התנגשות שממתינה להחלטה',syncing:'מסנכרן…'}[ST.state];
 return`<div class="sbox"><h3>חשבון וסנכרון</h3><p>מחובר כ-<b>${esc(localStorage.getItem(UKEY)||'—')}</b> · מכשיר: ${esc(SYNC.device)}</p>
 <div class="hrow" style="border:0"><span style="width:auto"><b>מצב:</b> ${stx}</span></div>
 <div class="hrow" style="border:0"><span style="width:auto"><b>סנכרון אחרון:</b> ${ST.last?fmtDT(new Date(ST.last).toISOString()):'—'} · <b>ממתינים:</b> ${ST.pending}</span></div>
 <div class="quick" style="margin-top:6px"><button data-acc="sync">${ic('refresh',16)} סנכרן עכשיו</button><button data-acc="pw">החלפת סיסמה</button><button data-acc="out" style="color:var(--red)">${ic('logout',16)} התנתקות</button></div>
 <p style="margin-top:10px">התקנה בפלאפון: בדפדפן בחרו "הוסף למסך הבית". המערכת תיפתח כמו אפליקציה ותעבוד גם בלי קליטה.</p></div>`}
$('#p-settings').addEventListener('click',async e=>{const a=e.target.closest('[data-acc]');if(!a)return;const k=a.dataset.acc;
 if(k==='sync'){ST.offline=false;syncNow();toast('מסנכרן…')}
 if(k==='out')doLogout();
 if(k==='pw'){const p=prompt('סיסמה חדשה (לפחות 8 תווים):');if(!p)return;if(p.length<8){toast('הסיסמה קצרה מדי');return}
  try{const{error}=await sb.auth.updateUser({password:p});toast(error?'שגיאה: '+error.message:'הסיסמה הוחלפה')}catch(x){toast('אין חיבור')}}});
function registerSW(){if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{})}

/* ---------- init ---------- */
function injectIcons(){$('#icSearch').outerHTML=ic('search');$('#qclr').innerHTML=ic('x',16);$('#icFilter').outerHTML=ic('sliders');$('#fab').innerHTML=ic('plus',28);$('#btnNew').innerHTML=ic('plus',16)+' ליד חדש';['icClose1','icClose2','icClose3'].forEach(i=>$('#'+i).innerHTML=ic('x',18));$('#dPdf').innerHTML=ic('file',18);
 $('[data-undo]').innerHTML=ic('undo');$('[data-redo]').innerHTML=ic('redo');$('#btnPdf').innerHTML=ic('file')+'<span class="pdftx"> PDF</span>'}
injectIcons();load();buildNav();applyHash();render();boot();registerSW();
</script>
</body>
</html>
